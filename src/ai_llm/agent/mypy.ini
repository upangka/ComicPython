[mypy]
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
show_error_codes = True
pretty = True

# 只禁用特定的错误代码，而不是完全跳过导入
[mypy-langchain_anthropic.*]
disable_error_code = call-arg

[mypy-langchain_openai.*]
disable_error_code = call-arg

[mypy-langchain_google_genai.*]
disable_error_code = call-arg

[mypy-langchain_core.*]
disable_error_code = call-arg

[mypy-langchain.*]
disable_error_code = call-arg
